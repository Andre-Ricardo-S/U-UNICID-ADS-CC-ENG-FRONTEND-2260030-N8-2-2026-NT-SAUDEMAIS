<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t">
  <title id="t">Mapa de bairro com rota segura em azul da casa até o posto e um atalho perigoso com escadaria marcado em vermelho</title>
  <rect width="800" height="500" fill="#e2e8f0"/>
  <!-- Ruas -->
  <rect y="300" width="800" height="40" fill="#ffffff"/>
  <rect y="150" width="800" height="40" fill="#ffffff"/>
  <rect x="250" width="40" height="500" fill="#ffffff"/>
  <rect x="520" width="40" height="500" fill="#ffffff"/>
  <!-- Atalho perigoso (escadaria) -->
  <polyline points="150,380 200,250 400,240" fill="none" stroke="#b91c1c" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round"/>
  <polyline points="185,280 185,268 197,268 197,256 209,256 209,244 221,244" fill="none" stroke="#b91c1c" stroke-width="5"/>
  <circle cx="400" cy="240" r="16" fill="#b91c1c"/>
  <path d="M392 232 L408 248 M408 232 L392 248" stroke="#ffffff" stroke-width="4"/>
  <!-- Rota segura -->
  <polyline points="150,410 270,410 270,320 540,320 540,170 640,170" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ponto de apoio -->
  <circle cx="410" cy="320" r="20" fill="#0f172a"/>
  <text x="410" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <!-- Casa -->
  <polygon points="85,390 120,355 155,390" fill="#1e3a8a"/>
  <rect x="95" y="390" width="50" height="40" fill="#1e3a8a"/>
  <rect x="113" y="405" width="14" height="25" fill="#ffffff"/>
  <!-- Posto -->
  <rect x="630" y="90" width="100" height="80" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="4"/>
  <rect x="672" y="102" width="16" height="56" fill="#2563eb"/>
  <rect x="652" y="122" width="56" height="16" fill="#2563eb"/>
</svg>
